<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAXI Sports API — Browser Client</title>
  <!-- highlight.js — used for MAXI syntax highlighting in the wire panels -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <h1>MAXI Sports API</h1>
  <span class="badge">Browser Client</span>
</header>

<div class="toolbar">
  <label for="backend-select">Backend</label>
  <select id="backend-select" style="background:#1e2330;border:1px solid #334155;color:#e2e8f0;padding:0.45rem 0.75rem;border-radius:6px;font-size:0.9rem;">
    <option value="http://localhost:8040">Java :8040</option>
    <option value="http://localhost:8050">Go :8050</option>
    <option value="http://localhost:8060">JS :8060</option>
    <option value="http://localhost:8070">Python :8070</option>
    <option value="http://localhost:8080">PHP :8080</option>
    <option value="custom">Custom…</option>
  </select>
  <label for="base-url" id="custom-url-label" style="display:none">URL</label>
  <input id="base-url" type="text" value="http://localhost:8050" style="display:none" />
  <button id="load-btn">Load All</button>
  <button id="reload-btn" class="btn-secondary" style="display:none">↺ Reload</button>
</div>

<div id="status-bar">Ready — click "Load All" to fetch data from the API.</div>

<div class="sections" id="sections"></div>

<script type="module" src="app.js"></script>
</body>
</html>
