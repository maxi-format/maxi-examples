# Port — reads PORT env var, defaults to 8040
quarkus.http.port=${PORT:8040}

# CORS — allow all origins (development / demo server)
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.headers=Content-Type,Accept
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# Produce an uber-jar so the Docker image only needs a single COPY
quarkus.package.jar.type=uber-jar

# Suppress verbose startup logging
quarkus.log.level=WARN
quarkus.banner.enabled=false
